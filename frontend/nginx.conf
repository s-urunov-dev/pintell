server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving through a variable (instead of baking the
    # backend's IP in at start-up) means a restarted backend container is picked
    # up automatically instead of turning into a permanent 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # The SPA and the API are served from one origin, so the browser never
    # makes a cross-origin request (CORS stays a dev-only concern).
    # NOTE: with a variable in proxy_pass, nginx forwards the URI verbatim,
    # hence $request_uri (the backend paths match the frontend ones 1:1).
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django admin + its static files, handy while demoing.
    location /admin/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # nginx's bundled mime.types has no entry for .mjs, so an ES-module asset
    # is served as application/octet-stream — and with `nosniff` set below the
    # browser refuses to execute it. That is not theoretical: it is how the PDF
    # viewer's worker failed, silently, with the library falling back to a
    # "fake worker" that could not load either.
    #
    # A regex location rather than a `types` block, and the difference is the
    # whole fix. A `types` block here *replaces* the inherited map instead of
    # extending it, so adding one entry served every .js, .css and .png in the
    # build as application/octet-stream — a far worse bug than the one being
    # fixed, and one that looks identical from the browser. `default_type`
    # applies only where the map has no answer, which for .mjs is exactly here.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Baseline hardening for the static app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
